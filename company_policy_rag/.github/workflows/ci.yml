name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend Linting ───────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: company_policy_rag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install ruff mypy types-redis pydantic

      - name: Run ruff check
        run: ruff check backend/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check backend/

      - name: Run mypy
        run: mypy backend/ --ignore-missing-imports --no-error-summary || true

  # ── Backend Tests ─────────────────────────────────────────
  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: company_policy_rag
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install redis>=5.0.0

      - name: Run pytest
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_ENABLED: "true"
          PYTHONPATH: .
        run: pytest tests/ -v --tb=short -q --no-header

  # ── Frontend Lint ─────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint (next lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: company_policy_rag/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: company_policy_rag/frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run next lint
        run: npx next lint --max-warnings 0 || true

  # ── Frontend Build ────────────────────────────────────────
  frontend-build:
    name: Frontend Build (TypeScript check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: company_policy_rag/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: company_policy_rag/frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ── Docker Compose Build ──────────────────────────────────
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint, frontend-build]
    defaults:
      run:
        working-directory: company_policy_rag
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create environment file
        run: cp .env.example .env 2>/dev/null || cp .env.docker.example .env 2>/dev/null || touch .env

      - name: Build all services
        run: docker compose build --no-cache

      - name: Verify images created
        run: docker compose images
