name: RAG CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "company_policy_rag/**"
      - ".github/workflows/rag-ci.yml"
  push:
    branches:
      - main
    paths:
      - "company_policy_rag/**"
      - ".github/workflows/rag-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: company_policy_rag

env:
  ANONYMIZED_TELEMETRY: "False"
  RERANKER_DEVICE: cpu
  HF_HOME: ${{ github.workspace }}/company_policy_rag/.cache/huggingface

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: company_policy_rag/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install "ruff>=0.6,<1.0"

      - name: Run core regression suite
        run: python scripts/run_core_tests.py

      - name: Conversation benchmark gate
        run: >-
          python scripts/benchmark_conversation.py
          --assert-minimums
          --output "${{ runner.temp }}/conversation-benchmark.json"
          --report "${{ runner.temp }}/conversation-benchmark.md"

      - name: Ruff
        run: >-
          python -m ruff check
          backend/rag/conversation_interpreter.py
          backend/api/main.py
          backend/services/document_service.py
          scripts/benchmark_conversation.py
          scripts/production_retrieval_smoke.py
          scripts/run_core_tests.py
          tests/test_conversation_interpreter.py
          tests/unit/test_conversation_benchmark.py
          tests/unit/test_production_retrieval_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: company_policy_rag/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: company_policy_rag/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test

      - name: Build production UI
        run: npm run build

  eval-smoke:
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: company_policy_rag/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Self-contained: shipped loader, chunker, Chroma and BM25 with no downloads.
      - name: Production retrieval smoke gate
        run: >-
          python scripts/production_retrieval_smoke.py
          --assert-minimums
          --output "${{ runner.temp }}/production-retrieval-smoke.json"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: company_policy_rag/.cache/huggingface
          key: hf-bge-small-en-v1.5

      # EmbeddingService loads models with HF_HUB_OFFLINE=1, so fetch them first.
      - name: Download embedding model
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('BAAI/bge-small-en-v1.5')"

      # Production retrieval + context assembly (no LLM) on the labelled handbook
      # fixture; fails when context hit, rank, or coverage drops below baseline.
      - name: Backend retrieval smoke gate
        run: python scripts/ci_retrieval_smoke.py
